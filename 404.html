<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nie znaleziono strony – Axisflow</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141314">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#141314; --mint:#cdf5de; --soft:#a9a69d; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; overflow: hidden; position: relative;
    background: var(--ink); color: #ecebe6;
    font-family: "Figtree", system-ui, sans-serif; font-size: 17px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .blob { position: fixed; display: block; pointer-events: none; filter: blur(48px); animation: morph 16s ease-in-out infinite alternate; }
  .b1 { width: min(46vw, 560px); aspect-ratio: 1.15; right: -8%; top: 4%; background: #1f8a4e; opacity: .4; border-radius: 62% 38% 46% 54% / 55% 40% 60% 45%; }
  .b2 { width: min(32vw, 380px); aspect-ratio: 1; left: -6%; bottom: -6%; background: #c4693f; opacity: .2; border-radius: 40% 60% 55% 45% / 50% 55% 45% 50%; animation-duration: 21s; animation-delay: -7s; }
  @keyframes morph {
    0%   { border-radius: 62% 38% 46% 54% / 55% 40% 60% 45%; transform: translate(0,0) rotate(0deg); }
    50%  { border-radius: 40% 60% 58% 42% / 42% 58% 42% 58%; transform: translate(-30px,24px) rotate(12deg); }
    100% { border-radius: 54% 46% 36% 64% / 60% 36% 64% 40%; transform: translate(18px,-20px) rotate(-8deg); }
  }
  main { position: relative; width: min(100% - 40px, 640px); text-align: center; padding: 40px 0; }
  .logo { display: inline-block; margin-bottom: clamp(28px, 6vh, 56px); }
  .logo img { width: 111px; height: auto; display: block; }
  .code {
    font-family: "Inter Tight", sans-serif; font-weight: 600; letter-spacing: -.06em; line-height: .9;
    font-size: clamp(6rem, 26vw, 13rem); margin: 0; color: var(--mint);
  }
  h1 { font-family: "Inter Tight", sans-serif; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; font-size: clamp(1.6rem, 5vw, 2.4rem); margin: .3em 0 .4em; }
  p { color: var(--soft); margin: 0 auto 2em; max-width: 34ch; }
  .btn {
    display: inline-block; text-decoration: none; font-weight: 700; color: var(--ink); background: var(--mint);
    padding: .9em 1.7em; border-radius: 999px; transition: background .2s, transform .2s;
  }
  .btn:hover { background: #e2fbec; transform: translateY(-2px); }
  .btn:focus-visible { outline: 2px solid var(--mint); outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }
</style>
</head>
<body>
<span class="blob b1" aria-hidden="true"></span>
<span class="blob b2" aria-hidden="true"></span>
<main>
  <a class="logo" href="https://p2quared.github.io/axisflow" aria-label="Axisflow – strona główna"><img src="/assets/logo-wide-transparent.webp" alt="Axisflow" width="111" height="52" id="logo-img"></a>
  <p class="code" aria-hidden="true">404</p>
  <h1>Ta strona uciekła ze smyczy</h1>
  <p>Nie możemy jej znaleźć. Wróć na stronę główną, a my pójdziemy jej szukać.</p>
  <a class="btn" href="https://p2quared.github.io/axisflow">Wróć na stronę główną</a>
</main>
<script>
  // This page can be served from the site root (custom domain) or from a repo sub-folder (user.github.io/repo/).
  // Find the folder the site really lives in by testing where the logo loads from, then point the logo there. Both links go to the live site.
  (function () {
    var seg = location.pathname.split("/")[1], bases = ["/"];
    if (seg) bases.push("/" + seg + "/");
    var file = "assets/logo-wide-transparent.webp";
    (function next(i) {
      if (i >= bases.length) return;
      var t = new Image();
      t.onload = function () {
        document.getElementById("logo-img").src = bases[i] + file;
      };
      t.onerror = function () { next(i + 1); };
      t.src = bases[i] + file;
    })(0);
  })();
</script>
</body>
</html>
